<div class="container"><div class="head"><div><h1>Dashboard</h1><p>Loan application overview</p></div><a class="btn primary" routerLink="/loan/new">+ Apply New Loan</a></div><div class="grid grid4"><div class="card stat"><span>Total Loans</span><b>{{loans.length}}</b></div><div class="card stat"><span>Pending</span><b>{{count('PENDING')}}</b></div><div class="card stat"><span>Approved</span><b>{{count('APPROVED')}}</b></div><div class="card stat"><span>Sanctioned</span><b>{{count('SANCTIONED')}}</b></div></div><div class="card table-card"><h2>Recent Loans</h2><div *ngIf="loading">Loading...</div><table *ngIf="!loading"><tr><th>Customer</th><th>Type</th><th>Amount</th><th>Status</th></tr><tr *ngFor="let l of loans.slice(0,6)"><td>{{l.customerName}}</td><td>{{l.loanType}}</td><td>₹ {{l.loanAmount|number}}</td><td><span class="badge">{{l.status}}</span></td></tr></table></div></div>
