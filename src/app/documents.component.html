<div class="container">
  <a [routerLink]="['/loan',loanId]" class="back">← Back to Loan Details</a>

  <div class="card">
    <h1>Loan Documents</h1>
    <p>Loan ID: <strong>#{{loanId}}</strong></p>

    <div *ngIf="message" class="success">{{message}}</div>
    <div *ngIf="errorMessage" class="error">{{errorMessage}}</div>

    <div class="grid grid2 upload-box">
      <div>
        <label>Document Type</label>
        <select class="input" [(ngModel)]="documentType">
          <option>Aadhaar</option>
          <option>PAN Card</option>
          <option>Income Proof</option>
          <option>Bank Statement</option>
          <option>Property Document</option>
        </select>
      </div>

      <div>
        <label>Select File</label>
        <input class="input" type="file" (change)="choose($event)">
      </div>
    </div>

    <button class="btn primary" (click)="upload()" [disabled]="!file || uploading">
      {{uploading?'Uploading...':'Upload Document'}}
    </button>
  </div>

  <div class="card list">
    <h2>Uploaded Documents</h2>

    <p *ngIf="documents.length===0" class="empty">No documents uploaded yet.</p>

    <div class="table-wrap" *ngIf="documents.length>0">
      <table>
        <tr><th>Type</th><th>File</th><th>Status</th><th>Action</th></tr>
        <tr *ngFor="let d of documents">
          <td>{{d.documentType}}</td>
          <td>{{d.fileName}}</td>
          <td>
            <span class="status" [class.pending]="d.status==='PENDING'" [class.verified]="d.status==='VERIFIED'" [class.rejected]="d.status==='REJECTED'">
              {{d.status}}
            </span>
          </td>
          <td>
            <button class="mini ok" *ngIf="d.status==='PENDING'" (click)="verify(d.id)">Verify</button>
            <button class="mini bad" *ngIf="d.status==='PENDING'" (click)="reject(d.id)">Reject</button>
          </td>
        </tr>
      </table>
    </div>
  </div>
</div>
