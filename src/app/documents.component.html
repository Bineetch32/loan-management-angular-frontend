<div class="container"><div class="card"><h1>Loan Documents</h1><p>Loan ID: {{loanId}}</p><div class="grid grid2"><div><label>Document Type</label><select class="input" [(ngModel)]="documentType"><option>Aadhaar</option><option>PAN Card</option><option>Income Proof</option><option>Bank Statement</option><option>Property Document</option></select></div><div><label>Select File</label><input class="input" type="file" (change)="choose($event)"></div></div><br><button class="btn primary" (click)="upload()" [disabled]="!file">Upload Document</button><p class="success">{{message}}</p></div><div class="card list"><h2>Uploaded Documents</h2><table><tr><th>Type</th><th>File</th><th>Status</th><th>Action</th></tr><tr *ngFor="let d of documents"><td>{{d.documentType}}</td><td>{{d.fileName}}</td><td>{{d.status}}</td><td><button class="mini ok" *ngIf="d.status==='PENDING'" (click)="verify(d.id)">Verify</button><button class="mini bad" *ngIf="d.status==='PENDING'" (click)="reject(d.id)">Reject</button></td></tr></table></div></div>
