<div class="container">
  <div class="head">
    <div><h1>Loans</h1><p>Manage all loan applications</p></div>
    <a routerLink="/loan/new" class="btn primary">+ New Loan</a>
  </div>

  <div class="card">
    <input class="input" placeholder="Search customer or loan type..." [(ngModel)]="search" (input)="filter()">
    <div class="table-wrap">
      <table>
        <tr><th>ID</th><th>Customer</th><th>Type</th><th>Amount</th><th>CIBIL</th><th>Status</th><th>Actions</th></tr>
        <tr *ngFor="let l of filtered">
          <td>{{l.id}}</td>
          <td><a [routerLink]="['/loan',l.id]" class="customer-link">{{l.customerName}}</a></td>
          <td>{{l.loanType}}</td>
          <td>₹ {{l.loanAmount|number}}</td>
          <td>{{l.cibilScore}}</td>
          <td><span class="status" [class.pending]="l.status==='PENDING'" [class.approved]="l.status==='APPROVED'" [class.rejected]="l.status==='REJECTED'" [class.sanctioned]="l.status==='SANCTIONED'">{{l.status}}</span></td>
          <td>
            <a class="mini" [routerLink]="['/loan',l.id]">View</a>
            <a class="mini" [routerLink]="['/loan/edit',l.id]">Edit</a>
            <button class="mini ok" *ngIf="l.status==='PENDING'" (click)="approve(l.id)">Approve</button>
            <button class="mini bad" *ngIf="l.status==='PENDING'" (click)="reject(l.id)">Reject</button>
            <button class="mini" *ngIf="l.status==='APPROVED'" (click)="sanction(l.id)">Sanction</button>
            <button class="mini bad" (click)="remove(l.id)">Delete</button>
          </td>
        </tr>
      </table>
    </div>
  </div>
</div>
