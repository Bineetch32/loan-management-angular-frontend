<div class="container"><div class="card emi"><h1>EMI Calculator</h1><p>Calculate EMI using the Spring Boot backend.</p><div class="grid grid2"><div><label>Loan Amount</label><input class="input" type="number" [(ngModel)]="amount"></div><div><label>Annual Interest Rate (%)</label><input class="input" type="number" [(ngModel)]="rate"></div><div><label>Tenure (Years)</label><input class="input" type="number" [(ngModel)]="years"></div></div><br><button class="btn primary" (click)="calculate()">Calculate EMI</button><div class="result" *ngIf="result"><h2>₹ {{result.monthlyEmi|number:'1.2-2'}} / month</h2><p>Total Payment: ₹ {{result.totalPayment|number:'1.2-2'}}</p><p>Total Interest: ₹ {{result.totalInterest|number:'1.2-2'}}</p></div></div></div>
